services:
  # 1. Database (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: omnishoe-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: omni_user
      POSTGRES_PASSWORD: omni_password
      POSTGRES_DB: omnishoe
    volumes:
      - postgres_data:/var/lib/postgresql/data


  # 3. Backend development (Node.js/Express)
  backend-dev:
    image: node:20-alpine
    container_name: omnishoe-backend-dev
    working_dir: /app/backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - backend_node_modules:/app/backend/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://omni_user:omni_password@db:5432/omnishoe?schema=public
    depends_on:
      - db
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma db push && npm run dev"

  # 4. Frontend development (Next.js)
  frontend-dev:
    image: node:20-alpine
    container_name: omnishoe-frontend-dev
    working_dir: /app/frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_next_cache:/app/frontend/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next_cache:
