services:
  # 1. Môi trường phát triển cục bộ (Development)
  frontend-dev:
    image: node:20-alpine
    container_name: omnishoe-frontend-dev
    working_dir: /app/frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      # Tránh mount đè node_modules và build cache từ máy host vào container
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_next_cache:/app/frontend/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    command: sh -c "npm install && npm run dev"

  # 2. Môi trường chạy thử nghiệm production (Production)
  frontend-prod:
    image: omnishoe-frontend-prod
    container_name: omnishoe-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1

volumes:
  frontend_node_modules:
  frontend_next_cache:
